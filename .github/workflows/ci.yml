name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  install_dependencies:
    name: Install Dependencies
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: volta-cli/action@v1
      - name: Cache pnpm modules
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@v4
      - name: Install Dependencies
        run: pnpm install

  eslint:
    name: ESLint
    needs:
      - install_dependencies
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        path:
          # - ./docs
          - ./ember-headlessui
          - ./test-app
          # - ./test-build
    steps:
      - uses: actions/checkout@v7
      - uses: volta-cli/action@v1
      - name: Cache pnpm modules
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@v4
      - name: Install Dependencies
        run: pnpm install
      - name: ESLint
        run: pnpm lint:js
        working-directory: ${{ matrix.path }}

  build_test:
    name: Build Tests
    needs:
      - install_dependencies
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: volta-cli/action@v1
      - name: Cache pnpm modules
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@v4
      - name: Install Dependencies
        run: pnpm install
      - name: Build addon
        run: pnpm --filter ember-headlessui build
      - name: Assert package contents
        working-directory: ember-headlessui
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const required = ["addon-main.cjs", "package.json", "dist/components/dialog.js", "dist/_app_/components/dialog.js", "declarations/components/dialog.d.ts"];
            const missing = required.filter((f) => !files.includes(f));
            if (missing.length) { console.error("Missing from package:", missing); process.exit(1); }
            console.log(`Package contains ${files.length} files`);
          '

  tests:
    name: Default Tests
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - build_test
    steps:
      - uses: actions/checkout@v7
      - uses: volta-cli/action@v1
      - name: Cache pnpm modules
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@v4
      - name: Install Dependencies
        run: pnpm install
      - name: Build addon
        run: pnpm --filter ember-headlessui build
      - run: pnpm --filter test-app run test:ember

  try-scenarios:
    name: ${{ matrix.ember-try-scenario }}
    runs-on: ubuntu-latest
    needs: ["eslint", "tests"]
    timeout-minutes: 10
    # Canary is a nightly build of Ember, so a failure there is visible but
    # doesn't block the PR.
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        ember-try-scenario:
          - ember-lts-4.8
          - ember-lts-5.12
          - ember-lts-6.12
          - ember-release
          - ember-beta
        allow-failure: [false]
        include:
          - ember-try-scenario: ember-canary
            allow-failure: true

    steps:
      - uses: actions/checkout@v7
      - uses: volta-cli/action@v1
      - name: Cache pnpm modules
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@v4
      - name: Install Dependencies
        run: pnpm install
      - name: Build addon
        run: pnpm --filter ember-headlessui build
      - name: test
        working-directory: test-app
        run: >
          node_modules/.bin/ember try:one ${{ matrix.ember-try-scenario }}
          --skip-cleanup
